<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yuramon - Center Alignment</title>
    <style>
        /* Ensure the body takes up the full height of the viewport */
        body, html {
            height: 100%;
            margin: 0;
            display: flex;
            /* Center the content horizontally and vertically */
            justify-content: center;
            align-items: center;
            /* Background color matching the image's vibe */
            background-color: #fcfcf4;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <img src="yuramon_640x264up.png" alt="Yuramon Character Illustration" width="640" height="264">

</body>
</html>
