    <style>
        :root {
            color-scheme: dark;
            --bg-start: #0f172a;
            --bg-end: #1e293b;
            --panel: rgba(255, 255, 255, 0.12);
            --panel-border: rgba(255, 255, 255, 0.22);
            --panel-shadow: 0 30px 90px rgba(15, 23, 42, 0.35);
            --text: #eef2ff;
            --accent: #7dd3fc;
            --hero-title-size: clamp(1.1rem, 2.3vw, 1.9rem);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            min-height: 100%;
            margin: 0;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top left, rgba(125, 211, 252, 0.14), transparent 22%),
                        radial-gradient(circle at bottom right, rgba(99, 102, 241, 0.18), transparent 25%),
                        linear-gradient(180deg, var(--bg-start) 0%, var(--bg-end) 100%);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle at 20% 20%, rgba(125, 211, 252, 0.18), transparent 18%),
                              radial-gradient(circle at 80% 15%, rgba(139, 92, 246, 0.14), transparent 16%),
                              radial-gradient(circle at 50% 90%, rgba(96, 165, 250, 0.10), transparent 20%);
            pointer-events: none;
            z-index: 0;
        }

        .starfield {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .meteor {
            position: absolute;
            width: 16px;
            height: 16px;
            opacity: 0;
            background: radial-gradient(circle, rgba(255, 255, 220, 0.95) 0%, rgba(255, 240, 180, 0.9) 35%, rgba(255, 220, 130, 0.75) 65%, transparent 100%);
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            transform: rotate(25deg);
            filter: drop-shadow(0 0 24px rgba(255, 240, 180, 0.8));
            animation: shoot 4.8s linear infinite;
        }

        .meteor::before {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: 180px;
            height: 3px;
            background: linear-gradient(90deg, rgba(255, 255, 220, 0.5), rgba(255, 255, 220, 0.05));
            transform: translate(-50%, -50%) rotate(-14deg);
            filter: blur(1px);
            opacity: 0;
            animation: shoot 4.8s linear infinite;
        }

        .meteor:nth-child(1) {
            left: 6%;
            top: 6%;
            animation-delay: 0s;
            animation-duration: 4.8s;
        }

        .meteor:nth-child(2) {
            left: 12%;
            top: 16%;
            animation-delay: 0.8s;
            animation-duration: 5.2s;
        }

        .meteor:nth-child(3) {
            left: 18%;
            top: 9%;
            animation-delay: 0.4s;
            animation-duration: 5.0s;
        }

        .meteor:nth-child(4) {
            left: 24%;
            top: 21%;
            animation-delay: 1.3s;
            animation-duration: 5.6s;
        }

        .meteor:nth-child(5) {
            left: 29%;
            top: 7%;
            animation-delay: 0.2s;
            animation-duration: 4.6s;
        }

        .meteor:nth-child(6) {
            left: 35%;
            top: 18%;
            animation-delay: 1.0s;
            animation-duration: 5.8s;
        }

        .meteor:nth-child(7) {
            left: 40%;
            top: 5%;
            animation-delay: 0.6s;
            animation-duration: 6.0s;
        }

        .meteor:nth-child(8) {
            left: 46%;
            top: 14%;
            animation-delay: 1.7s;
            animation-duration: 5.1s;
        }

        .meteor:nth-child(9) {
            left: 52%;
            top: 8%;
            animation-delay: 0.3s;
            animation-duration: 4.9s;
        }

        .meteor:nth-child(10) {
            left: 58%;
            top: 24%;
            animation-delay: 1.2s;
            animation-duration: 5.7s;
        }

        .meteor:nth-child(11) {
            left: 64%;
            top: 11%;
            animation-delay: 0.5s;
            animation-duration: 5.3s;
        }

        .meteor:nth-child(12) {
            left: 70%;
            top: 19%;
            animation-delay: 1.1s;
            animation-duration: 6.1s;
        }

        .meteor:nth-child(13) {
            left: 76%;
            top: 6%;
            animation-delay: 0.9s;
            animation-duration: 4.7s;
        }

        .meteor:nth-child(14) {
            left: 80%;
            top: 23%;
            animation-delay: 1.8s;
            animation-duration: 5.5s;
        }

        .meteor:nth-child(15) {
            left: 84%;
            top: 10%;
            animation-delay: 0.7s;
            animation-duration: 5.9s;
        }

        .meteor:nth-child(16) {
            left: 90%;
            top: 4%;
            animation-delay: 1.4s;
            animation-duration: 6.2s;
        }

        .meteor:nth-child(17) {
            left: 7%;
            top: 25%;
            animation-delay: 2.0s;
            animation-duration: 5.4s;
        }

        .meteor:nth-child(18) {
            left: 15%;
            top: 12%;
            animation-delay: 1.6s;
            animation-duration: 5.0s;
        }

        .meteor:nth-child(19) {
            left: 33%;
            top: 28%;
            animation-delay: 2.3s;
            animation-duration: 5.7s;
        }

        .meteor:nth-child(20) {
            left: 55%;
            top: 27%;
            animation-delay: 2.6s;
            animation-duration: 6.3s;
        }

        .meteor:nth-child(21) {
            left: 82%;
            top: 27%;
            animation-delay: 2.1s;
            animation-duration: 5.6s;
        }

        @keyframes shoot {
            0% {
                opacity: 0;
                transform: translate(0, 0) rotate(25deg) scale(0.45);
            }
            12% {
                opacity: 1;
                transform: translate(10vw, 7vh) rotate(25deg) scale(1);
            }
            80% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translate(52vw, 34vh) rotate(25deg) scale(0.8);
            }
        }

        main {
            position: relative;
            z-index: 1;
            width: min(100%, 960px);
            display: grid;
            gap: 28px;
            padding: clamp(28px, 4vw, 52px);
            border-radius: 32px;
            background: var(--panel);
            border: 1px solid var(--panel-border);
            box-shadow: var(--panel-shadow);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            overflow: hidden;
        }

        .hero {
            display: grid;
            gap: 24px;
            align-items: center;
            grid-template-columns: 1fr;
        }

        .hero-copy {
            display: grid;
            gap: 18px;
            justify-items: center;
            text-align: center;
        }

        .hero-copy h1 {
            font-size: var(--hero-title-size);
            line-height: 1.05;
            margin: 0;
            white-space: nowrap;
            overflow-wrap: normal;
        }

        .hero-copy p {
            margin: 0;
            max-width: 72ch;
            color: rgba(238, 242, 255, 0.82);
            font-size: 1.06rem;
            line-height: 1.75;
        }

        .hero-copy .tag {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.85rem 1.1rem;
            border-radius: 999px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.08));
            color: rgba(255, 255, 255, 0.95);
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 10px 30px rgba(15, 23, 42, 0.12);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition: background 0.25s ease, box-shadow 0.25s ease, transform 0.25s ease;
            width: fit-content;
        }

        .hero-copy .tag:hover,
        .hero-copy .tag:focus-visible {
            transform: translateY(-1px);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0.12));
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.24), 0 16px 40px rgba(15, 23, 42, 0.16);
        }

        .hero-visual {
            display: grid;
            place-items: center;
            width: 100%;
        }

        .card {
            width: 100%;
            max-width: 720px;
            border-radius: 28px;
            overflow: hidden;
            background: linear-gradient(180deg, rgba(255,255,255,0.16), rgba(255,255,255,0.04));
            border: 1px solid rgba(255,255,255,0.14);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), 0 22px 60px rgba(15, 23, 42, 0.2);
        }

        .card img {
            display: block;
            width: 100%;
            height: auto;
            object-fit: cover;
        }

        .panel {
            display: grid;
            gap: 14px;
            padding: 22px 26px 24px;
            color: rgba(238, 242, 255, 0.88);
        }

        .panel strong {
            color: white;
            font-size: 1.05rem;
        }

        .panel small {
            color: rgba(226, 232, 240, 0.75);
            display: block;
            text-align: center;
            margin-top: 0.5rem;
        }

        .panel small a {
            color: rgba(226, 232, 240, 0.95);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            font-weight: 500;
        }

        .panel small.copyright {
            font-size: 0.60rem;
            color: rgba(226, 232, 240, 0.65);
            letter-spacing: 0.02em;
        }

        .panel small a:hover,
        .panel small a:focus-visible {
            color: var(--accent);
        }

        .mail-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 1.1rem;
            height: 1.1rem;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            color: white;
            font-size: 0.85rem;
        }

        .links {
            display: grid;
            gap: 10px;
            padding-bottom: 6px;
        }

        .links a {
            color: rgba(255, 255, 255, 0.92);
            text-decoration: none;
            transition: color 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            white-space: nowrap;
            padding: 0.6rem 0.85rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
        }

        .links a:hover,
        .links a:focus-visible {
            color: var(--accent);
        }

        .link-item {
            display: inline-grid;
            grid-auto-flow: column;
            gap: 0.75rem;
            align-items: center;
            justify-content: start;
        }

        .link-icon {
            width: 1.25rem;
            height: 1.25rem;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            font-family: inherit;
            letter-spacing: 0.05em;
            color: white;
            background: rgba(255, 255, 255, 0.18);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }

        .github-icon {
            background: linear-gradient(135deg, #0d1117 0%, #30363d 100%);
        }

        .x-icon {
            background: #000;
        }

        .sketchfab-icon {
            background: linear-gradient(135deg, #00a0d8 0%, #0077b6 100%);
        }

        .youtube-icon {
            background: linear-gradient(135deg, #ff0000 0%, #c4302b 100%);
        }

        @media (min-width: 840px) {
            .hero {
                grid-template-columns: 1fr 1fr;
                gap: 40px;
            }
        }

        @media (max-width: 640px) {
            html, body {
                padding: 16px;
            }

            main {
                padding: 20px;
            }

            .hero {
                gap: 20px;
            }

            .hero-copy {
                gap: 12px;
                text-align: center;
            }

            .hero-copy h1 {
                font-size: 2rem;
                white-space: normal;
            }

            .hero-copy .tag {
                font-size: 1rem;
                padding: 0.65rem 0.95rem;
            }

            .card {
                border-radius: 24px;
            }

            .links {
                gap: 8px;
            }
        }
    </style>
</head>

                            <a class="link-item" href="https://x.com/yuramon_create" target="_blank" rel="noopener noreferrer" aria-label="X">
